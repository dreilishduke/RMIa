<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoodCheck · RMIa Week 9</title>
<style>
:root{
  --ink:#1E2A2E; --head:#2C4A52; --a1:#46717E; --a2:#2F5D50; --grey:#55636A;
  --mint:#CFE3DA; --pale:#EEF4F1; --bg:#FFFFFF; --line:#C9D6D0; --ochre:#8A6A3B;
  --ok:#2F5D50; --okbg:#DDEFE5; --no:#8A3B2E; --nobg:#F6E3DF;
  color-scheme: light;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,"Segoe UI",Aptos,system-ui,sans-serif}
header{background:var(--head);color:#fff;padding:22px 16px 18px}
header .wrap,main{max-width:560px;margin:0 auto}
header h1{margin:6px 0 4px;font-size:1.5rem;line-height:1.2}
header p{margin:0;opacity:.92;font-size:.95rem}
.pill{display:inline-block;background:var(--a1);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem}
main{padding:12px 16px 48px}
.testbar{background:#FFF4D6;color:#5A4300;border-bottom:1px solid #E8D6A0;padding:8px 16px;font-size:.92rem;text-align:center}
.progress{display:flex;gap:6px;margin:12px 0 4px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--pale)}
.progress span.on{background:var(--a2)}
section.card{border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:16px 0;background:#fff}
section.card h2{margin:0 0 6px;font-size:1.3rem;color:var(--head)}
.lead{color:var(--grey);margin:0 0 12px}
ul.facts{margin:8px 0 14px;padding-left:20px}
ul.facts li{margin:4px 0}
.btn{display:block;width:100%;font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;min-height:52px;cursor:pointer;background:var(--a2);color:#fff;margin-top:12px}
.btn.secondary{background:var(--pale);color:var(--head);border:2px solid var(--line)}
.btn:disabled{background:#B9C6C1;color:#F4F7F5;cursor:not-allowed}
.scale{margin:18px 0 6px}
.scale h3{margin:0 0 2px;font-size:1.1rem}
.scale .hint{margin:0 0 8px;color:var(--grey);font-size:.92rem}
.sam{display:grid;grid-template-columns:1fr .6fr 1fr .6fr 1fr .6fr 1fr .6fr 1fr;gap:2px;align-items:end}
.sam button{font:inherit;background:#fff;border:2px solid transparent;border-radius:10px;padding:4px 0;min-height:48px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.sam button svg{width:100%;max-width:58px;height:auto;display:block}
.sam button .dot{width:12px;height:12px;border-radius:50%;background:var(--line);margin-bottom:18px}
.sam button[aria-pressed="true"]{background:var(--mint);border-color:var(--a2)}
.sam button[aria-pressed="true"] .dot{background:var(--a2)}
.ends{display:flex;justify-content:space-between;font-size:.88rem;color:var(--grey);margin-top:4px}
.codebox{display:flex;gap:8px;margin-top:10px}
.codebox input{flex:1;font:inherit;font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;border:2px solid var(--line);border-radius:12px;min-width:0}
.codebox input:focus{outline:3px solid var(--a1);outline-offset:1px}
.codebox .btn{width:auto;margin:0;padding:10px 18px}
.fb{margin-top:10px;font-size:.95rem;border-radius:10px;padding:8px 12px}
.fb.bad{background:var(--nobg);color:var(--no)}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb:empty{display:none}
.phone-down{font-size:3rem;text-align:center;margin:6px 0}
.summary{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:.98rem}
.summary th,.summary td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.summary th:first-child,.summary td:first-child{text-align:left}
svg.chart{width:100%;height:auto;display:block;margin:8px 0}
.small{font-size:.9rem;color:var(--grey)}
:focus-visible{outline:3px solid var(--a1);outline-offset:2px}
</style>
</head>
<body>
<div class="testbar" id="testbar" hidden>Test mode: nothing will be saved. Codes: MAPLE, then RIVER.</div>
<header><div class="wrap">
  <span class="pill">RMIa · Week 9 experiment</span>
  <h1>How do you feel?</h1>
  <p>Three quick ratings during the lecture. Anonymous and optional.</p>
</div></header>

<main>
<div class="progress" aria-hidden="true"><span id="p1"></span><span id="p2"></span><span id="p3"></span><span id="p4"></span></div>
<div id="app" aria-live="polite"></div>
</main>

<script>
/* ===== SETTINGS ===== */
// Paste your Google Apps Script web-app URL between the quotes (see MoodCheck-AppsScript.gs).
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyZLJXx2btQQl-SfoNUw-ZeH9pDCX14dZaunMqYV1iJeFKYBXu4lNMBRfadLHwNXq_9/exec";
const CODE2 = "MAPLE";   // shown at the end of the maths task
const CODE3 = "RIVER";   // shown on the slide after the relaxation video
const STORE_KEY = "rmia_moodcheck_w9";

/* ===== STATE ===== */
const TEST = new URLSearchParams(location.search).has("test");
if (TEST) document.getElementById("testbar").hidden = false;
const blank = () => ({ step: "intro", r: {}, id: Math.random().toString(36).slice(2, 10) + Date.now().toString(36) });
let S = load() || blank();
let draft = {};          // the rating currently being made
let sending = false;

function load(){
  if (TEST) return null;
  try { const v = JSON.parse(localStorage.getItem(STORE_KEY)); return v && v.step ? v : null; } catch(e){ return null; }
}
function save(){
  if (TEST) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){}
}
function go(step){ S.step = step; draft = {}; save(); render(); window.scrollTo(0, 0); }

/* ===== SAM FIGURES (drawn for this module) ===== */
function figure(kind, level){
  // level 1..9 (odd levels only are drawn)
  const k = (level - 5) / 4;                 // -1 .. 1
  const stroke = 'stroke="#1E2A2E" stroke-width="1.8" fill="none" stroke-linecap="round"';
  let face = "", extra = "";
  if (kind === "V"){
    face = `<circle cx="16.5" cy="13" r="1.4" fill="#1E2A2E"/><circle cx="23.5" cy="13" r="1.4" fill="#1E2A2E"/>
            <path d="M15 ${19 - 2.5*k} Q20 ${19 + 4*k} 25 ${19 - 2.5*k}" ${stroke}/>`;
  } else {
    const a = (level - 1) / 8;               // 0 .. 1
    if (level === 1){
      face = `<path d="M14.5 13 Q16.5 15 18.5 13" ${stroke}/><path d="M21.5 13 Q23.5 15 25.5 13" ${stroke}/>`;
    } else {
      const r = 1.1 + 1.6 * a;
      face = `<circle cx="16.5" cy="13" r="${r}" fill="#fff" stroke="#1E2A2E" stroke-width="1.3"/><circle cx="16.5" cy="13" r="0.9" fill="#1E2A2E"/>
              <circle cx="23.5" cy="13" r="${r}" fill="#fff" stroke="#1E2A2E" stroke-width="1.3"/><circle cx="23.5" cy="13" r="0.9" fill="#1E2A2E"/>`;
    }
    face += `<path d="M17 19.5 L23 19.5" ${stroke}/>`;
    // energy burst in the chest grows with arousal
    const n = Math.round(a * 8);
    for (let i = 0; i < n; i++){
      const ang = (i / Math.max(n,1)) * Math.PI * 2 - Math.PI/2;
      const r1 = 2.5, r2 = 3.5 + 4 * a;
      extra += `<line x1="${20 + r1*Math.cos(ang)}" y1="${38 + r1*Math.sin(ang)}" x2="${20 + r2*Math.cos(ang)}" y2="${38 + r2*Math.sin(ang)}" stroke="#8A6A3B" stroke-width="1.6" stroke-linecap="round"/>`;
    }
    if (n) extra += `<circle cx="20" cy="38" r="1.8" fill="#8A6A3B"/>`;
  }
  return `<svg viewBox="7 3 26 52" aria-hidden="true">
    <path d="M9 54 L11 31 Q20 25 29 31 L31 54 Z" fill="#EAF1ED" stroke="#1E2A2E" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="20" cy="15" r="10" fill="#F6F1E7" stroke="#1E2A2E" stroke-width="1.8"/>
    ${face}${extra}</svg>`;
}

function samScale(kind){
  const title = kind === "V" ? "Happy or unhappy?" : "Calm or wound-up?";
  const hint  = kind === "V" ? "How unhappy or happy you feel." : "How much energy: calm and sleepy, or wound-up and alert. Not good or bad.";
  const ends  = kind === "V" ? ["Unhappy", "Happy"] : ["Calm", "Wound-up"];
  let cells = "";
  for (let v = 1; v <= 9; v++){
    const inner = v % 2 ? figure(kind, v) : '<span class="dot"></span>';
    cells += `<button type="button" data-k="${kind}" data-v="${v}" aria-pressed="false" aria-label="${ends[0]} to ${ends[1]}: ${v} of 9">${inner}</button>`;
  }
  return `<div class="scale" role="group" aria-label="${title}">
    <h3>${title}</h3><p class="hint">${hint}</p>
    <div class="sam">${cells}</div>
    <div class="ends"><span>${ends[0]}</span><span>${ends[1]}</span></div></div>`;
}

/* ===== SCREENS ===== */
const app = document.getElementById("app");
function progress(n){ for (let i = 1; i <= 4; i++) document.getElementById("p" + i).className = i <= n ? "on" : ""; }

function render(){
  const st = S.step;
  if (st === "intro"){
    progress(0);
    app.innerHTML = `<section class="card">
      <h2>Before you start</h2>
      <p class="lead">You'll rate how you feel three times: now, after a maths task, and after a relaxation video. About 15 minutes.</p>
      <ul class="facts">
        <li><strong>Anonymous:</strong> no name or student number.</li>
        <li><strong>Optional:</strong> you can just watch.</li>
        <li><strong>Nothing is sent until you press Submit</strong> at the very end. Close this page at any point to stop.</li>
        <li><strong>Can't be withdrawn after Submit</strong>, because nobody can tell which row is yours.</li>
        <li>The class's ratings become the Lab 8 dataset.</li>
      </ul>
      <button class="btn" id="yes">I'm happy to take part</button>
      <button class="btn secondary" id="no">I'd rather just watch</button></section>`;
    yes.onclick = () => go("r1");
    no.onclick = () => go("watch");
  }
  else if (st === "watch"){
    progress(0);
    app.innerHTML = `<section class="card"><h2>No problem</h2>
      <p class="lead">Nothing has been recorded. Just follow along with the lecture.</p>
      <button class="btn secondary" id="back">Actually, I'd like to take part</button></section>`;
    back.onclick = () => go("intro");
  }
  else if (st === "r1" || st === "r2" || st === "r3"){
    const n = +st[1];
    progress(n);
    const when = ["", "right now", "right now, straight after the task", "right now, after relaxing"][n];
    app.innerHTML = `<section class="card">
      <h2>Rating ${n} of 3</h2>
      <p class="lead">How do you feel <strong>${when}</strong>? Not how you usually feel. Use the spaces in between the figures too.</p>
      ${samScale("V")}${samScale("A")}
      <button class="btn" id="saveR" disabled>Save rating ${n}</button></section>`;
    app.querySelectorAll(".sam button").forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      app.querySelectorAll(`.sam button[data-k="${k}"]`).forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      draft[k] = +b.dataset.v;
      saveR.disabled = !(draft.V && draft.A);
    });
    saveR.onclick = () => {
      S.r["Valence_T" + n] = draft.V; S.r["Arousal_T" + n] = draft.A;
      go(n === 1 ? "code2" : n === 2 ? "code3" : "submit");
    };
  }
  else if (st === "code2" || st === "code3"){
    const n = st === "code2" ? 2 : 3;
    progress(n - 1);
    const what = n === 2 ? "after the maths task" : "after the relaxation video";
    app.innerHTML = `<section class="card">
      <div class="phone-down" aria-hidden="true">📱⬇</div>
      <h2>Saved. Put your phone down.</h2>
      <p class="lead">The next rating unlocks ${what}, when a code appears on the screen.</p>
      <label for="code"><strong>Code from the screen</strong></label>
      <div class="codebox"><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      <button class="btn" id="unlock">Go</button></div>
      <div class="fb" id="cfb"></div></section>`;
    const want = n === 2 ? CODE2 : CODE3;
    const tryCode = () => {
      const v = code.value.trim().toUpperCase();
      if (v === want) go("r" + n);
      else if (v === CODE3 && n === 2) cfb.className = "fb bad", cfb.textContent = "That's the code for the last rating. Wait for the code after the maths task.";
      else cfb.className = "fb bad", cfb.textContent = "Not quite. Check the code on the screen and try again.";
    };
    unlock.onclick = tryCode;
    code.onkeydown = e => { if (e.key === "Enter") tryCode(); };
  }
  else if (st === "submit"){
    progress(4);
    app.innerHTML = `<section class="card">
      <h2>All three saved. Ready to send?</h2>
      <p class="lead">Press Submit to add your ratings to the class dataset. After that they can't be withdrawn, because nobody can tell which row is yours.</p>
      ${chart(S.r)}
      <button class="btn" id="sub">Submit</button>
      <div class="fb" id="sfb"></div></section>`;
    sub.onclick = submit;
  }
  else if (st === "done"){
    progress(4);
    app.innerHTML = `<section class="card">
      <h2>Thank you: submitted</h2>
      <p class="lead">Here are your own three ratings. Did yours change? You'll analyse the whole class's ratings in Lab 8.</p>
      ${chart(S.r)}
      <p class="small">You can close this page now.</p></section>`;
  }
}

/* ===== YOUR RATINGS CHART ===== */
function chart(r){
  const W = 320, H = 190, L = 34, R = 92, T = 14, B = 34;
  const x = i => L + i * (W - L - R) / 2, y = v => T + (9 - v) * (H - T - B) / 8;
  let g = "";
  for (let v = 1; v <= 9; v += 2) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#E3EAE6"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#55636A">${v}</text>`;
  ["Start", "After maths", "After relaxing"].forEach((t, i) => g += `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="#55636A">${t}</text>`);
  const line = (key, col, lab, dy) => {
    const v = [1, 2, 3].map(i => r[key + "_T" + i]);
    const pts = v.map((val, i) => `${x(i)},${y(val)}`).join(" ");
    let s = `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
    v.forEach((val, i) => s += `<circle cx="${x(i)}" cy="${y(val)}" r="5" fill="${col}" stroke="#fff" stroke-width="2"/>`);
    s += `<text x="${x(2) + 10}" y="${y(v[2]) + 4 + dy}" font-size="12.5" font-weight="700" fill="#1E2A2E">${lab}</text>`;
    return s;
  };
  const clash = Math.abs(r.Valence_T3 - r.Arousal_T3) < 1.2;
  const dV = clash ? (r.Valence_T3 >= r.Arousal_T3 ? -7 : 7) : 0;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Your ratings: happy ${r.Valence_T1}, ${r.Valence_T2}, ${r.Valence_T3}; wound-up ${r.Arousal_T1}, ${r.Arousal_T2}, ${r.Arousal_T3} (1 to 9).">
    ${g}${line("Valence", "#2F5D50", "Happy", dV)}${line("Arousal", "#8A6A3B", "Wound-up", -dV)}</svg>
    <table class="summary"><tr><th></th><th>Start</th><th>After maths</th><th>After relaxing</th></tr>
    <tr><td>Happy (1–9)</td><td>${r.Valence_T1}</td><td>${r.Valence_T2}</td><td>${r.Valence_T3}</td></tr>
    <tr><td>Wound-up (1–9)</td><td>${r.Arousal_T1}</td><td>${r.Arousal_T2}</td><td>${r.Arousal_T3}</td></tr></table>`;
}

/* ===== SUBMIT (with retries, so a busy room doesn't lose data) ===== */
const wait = ms => new Promise(res => setTimeout(res, ms));
async function submit(){
  if (sending) return;
  sending = true;
  const btn = document.getElementById("sub"), fb = document.getElementById("sfb");
  btn.disabled = true; btn.textContent = "Sending…"; fb.className = "fb"; fb.textContent = "";
  const payload = Object.assign({ SubmissionID: S.id }, S.r);
  let ok = false;
  if (TEST){ await wait(700); ok = true; }
  else if (!/^https:\/\/script\.google\.com\//.test(ENDPOINT)){
    fb.className = "fb bad"; fb.textContent = "This form hasn't been connected to the data sheet yet. Please tell the lecturer.";
  } else {
    await wait(Math.random() * 2000);            // spread a room's worth of submissions out a little
    let why = "";
    const TRIES = 5;
    for (let attempt = 0; attempt < TRIES && !ok; attempt++){
      if (attempt){ fb.className = "fb"; fb.textContent = `The room is busy: trying again (${attempt + 1} of ${TRIES})…`; }
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
      try {
        const res = await fetch(ENDPOINT, { method: "POST", body: JSON.stringify(payload), signal: ctl.signal });
        const txt = await res.text();
        let j = null; try { j = JSON.parse(txt); } catch (_) {}
        if (!j) why = `reply was not data (HTTP ${res.status}): the script may need redeploying with access set to Anyone`;
        else { ok = !!j.ok; if (!ok) why = j.error || "unknown"; }
        if (j && j.error === "bad values") break;
      } catch (e) { why = e.name === "AbortError" ? "no reply after 15 s" : "couldn't reach the server (" + e.message + ")"; }
      clearTimeout(t);
      if (!ok && attempt < TRIES - 1) await wait(1200 * Math.pow(1.6, attempt) + Math.random() * 1200);
    }
    if (!ok){ fb.className = "fb bad"; fb.innerHTML = "Couldn't send just now. Your ratings are still here: please press Submit again in a moment.<br><small>Details for the lecturer: " + why.replace(/</g, "&lt;") + "</small>"; }
  }
  sending = false;
  if (ok) go("done");
  else if (btn){ btn.disabled = false; btn.textContent = "Submit"; }
}

render();
</script>
</body>
</html>
